<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLux 钱包签名</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px}
button{padding:10px 16px;font-size:15px;margin:6px 0;cursor:pointer}
pre{background:#f4f4f4;padding:12px;white-space:pre-wrap;word-break:break-all;font-size:13px}
#sig{width:100%;height:90px;font-size:13px}
.status{color:#555;font-size:14px}
.ok{color:green}.err{color:red}
</style>
</head>
<body>
<h1>AgentLux 钱包签名</h1>
<p>用你的 OKX Web3 钱包（0x93Be…e867）签一条消息，给 AgentLux 的 agent 做登录验证。只签名，不转钱、不花 gas。验证码 02:20:54 过期，过期就作废。</p>
<p class="status" id="status">消息已就绪，点“连接 OKX 钱包”。</p>
<pre id="msg">e1f336b81fe84cc4fda1eee6c02fa167f711da9545a52923b5dd3db89db8487d</pre>
<button id="connectBtn">1. 连接 OKX 钱包</button><br>
<button id="signBtn" disabled>2. 签名这条消息</button>
<p>签名结果（签完复制它，贴回给小智）：</p>
<textarea id="sig" readonly placeholder="签名会出现在这里"></textarea><br>
<button id="copyBtn">复制签名</button>
<script>
const EXPECTED_ADDR = '0x93Be7f04DE2FD79379F910f598D13e16E5d8e867';
const message = document.getElementById('msg').textContent;
let account = '';
const statusEl = document.getElementById('status');
const sigEl = document.getElementById('sig');
function setStatus(t, cls){ statusEl.textContent = t; statusEl.className = 'status ' + (cls||''); }
function provider(){
  if(window.okxwallet) return window.okxwallet;
  if(window.ethereum) return window.ethereum;
  return null;
}
document.getElementById('connectBtn').onclick = async () => {
  const p = provider();
  if(!p){ setStatus('没检测到钱包。请在 OKX App 内置浏览器里打开这个文件，然后刷新页面。', 'err'); return; }
  try{
    const accs = await p.request({method:'eth_requestAccounts'});
    account = accs[0];
    if(account.toLowerCase() !== EXPECTED_ADDR.toLowerCase()){
      setStatus('当前钱包地址是 ' + account + '，不是要签的 0x93Be…e867。请在 OKX 里切换到 0x93Be…e867 这个地址再点连接。', 'err');
      return;
    }
    setStatus('已连接：' + account + '。点“签名这条消息”。', 'ok');
    document.getElementById('signBtn').disabled = false;
  }catch(e){ setStatus('连接钱包失败：' + (e.message||e), 'err'); }
};
document.getElementById('signBtn').onclick = async () => {
  const p = provider();
  if(!p || !account){ setStatus('请先连接钱包。', 'err'); return; }
  try{
    const hexMsg = '0x' + Array.from(new TextEncoder().encode(message)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const sig = await p.request({method:'personal_sign', params:[hexMsg, account]});
    sigEl.value = sig;
    setStatus('签名成功！复制下面的签名，贴回给小智。', 'ok');
  }catch(e){ setStatus('签名失败/被取消：' + (e.message||e), 'err'); }
};
document.getElementById('copyBtn').onclick = async () => {
  if(!sigEl.value){ setStatus('还没有签名，先点“签名这条消息”。', 'err'); return; }
  try{ await navigator.clipboard.writeText(sigEl.value); setStatus('签名已复制，贴回给小智就行。', 'ok'); }
  catch(e){ sigEl.select(); setStatus('自动复制失败，已帮你选中签名，手动复制。', 'err'); }
};
</script>
</body>
</html>
